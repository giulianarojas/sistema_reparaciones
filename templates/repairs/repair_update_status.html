{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">Actualizar Estado - Reparación #{{ repair.id }}</h1>
        <a href="{% url 'repair_detail' repair_id=repair.id %}" class="d-none d-sm-inline-block btn btn-sm btn-secondary shadow-sm">
            <i class="fas fa-arrow-left fa-sm text-white-50"></i> Volver
        </a>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Cambiar Estado de la Reparación</h6>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="previous_status" value="{{ repair.status }}">

                <div class="alert alert-info">
                    <strong>Estado Actual:</strong> {{ repair.get_status_display }}
                </div>

                <div class="form-group">
                    <label>Nuevo Estado:</label>
                    <select class="form-control" name="status" required>
                        {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if value == repair.status %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle"></i> 
                    El cambio de estado quedará registrado en el historial de la reparación.
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sync"></i> Actualizar Estado
                </button>
            </form>
        </div>
    </div>

</div>

{% endblock %}
